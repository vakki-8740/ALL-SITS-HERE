<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F4F5F7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>P1-Admin · Parimatch</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/jpeg" href="LOGO/FASICON.jpg" />
  <link rel="apple-touch-icon" href="LOGO/FASICON.jpg" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
</head>
<body>

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="topbar-title">P1-Admin</div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="soundBtn" title="Sound alerts">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <span id="connDot" style="width:8px;height:8px;border-radius:50%;background:#F57C00;display:inline-block;"></span>
    </div>
  </header>

  <!-- HOME PAGE -->
  <main class="main-content">
    <section class="page active" id="page-home">
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-icon blue">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="stat-value" id="kpiTotal">0</div>
          <div class="stat-label">Total Users</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon orange">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          </div>
          <div class="stat-value" id="kpiTotalReq">0</div>
          <div class="stat-label">This Week</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <div class="stat-value" id="kpiToday">0</div>
          <div class="stat-label">Today Requests</div>
        </div>
      </div>

      <div class="section-header">
        <h2>Recent Requests</h2>
        <span class="count" id="listCount"></span>
      </div>

      <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="Search by email, mobile, name..." autocomplete="off" />
      </div>

      <div class="filter-bar">
        <div class="pill-row" id="rangePills">
          <button class="pill active" data-range="all">All</button>
          <button class="pill" data-range="1">24h</button>
          <button class="pill" data-range="7">7d</button>
          <button class="pill" data-range="30">30d</button>
        </div>
        <div class="pill-row" id="typePills"></div>
        <div class="filter-actions">
          <button class="pill" id="sortBtn">Newest &#8645;</button>
          <button class="pill" id="exportBtn">Export CSV</button>
          <button class="pill" id="selectAllBtn">Select All</button>
        </div>
      </div>

      <div class="select-bar" id="selectBar" hidden>
        <span id="selCount">0 selected</span>
        <div class="select-actions">
          <button class="pill" id="exportSelBtn">Export</button>
          <button class="pill danger" id="bulkDeleteBtn">Delete</button>
          <button class="pill" id="clearSelBtn">Clear</button>
        </div>
      </div>

      <div class="card-list" id="cardList"></div>
    </section>

    <!-- DETAIL PAGE -->
    <section class="page" id="page-detail">
      <div class="detail-page" id="detailPage">
        <div class="detail-header">
          <button class="back-btn" id="backBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <span class="detail-title">Request Details</span>
        </div>
        <div id="detailContent"></div>
      </div>
    </section>
  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-page="home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-item" data-page="home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
      <span>List</span>
    </button>
  </nav>

  <!-- IMAGE MODAL -->
  <div class="modal-overlay" id="imageModal">
    <button class="modal-close-top" id="imageModalClose">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <img class="modal-image" id="modalImage" src="" alt="View" />
  </div>

  <!-- SETTINGS -->
  <div class="confirm-overlay" id="settingsOverlay">
    <div class="confirm-box" style="max-width:380px;width:92%;">
      <h3>Settings</h3>
      <label class="set-label">Telegram Bot Token</label>
      <input class="set-input" id="tgToken" type="text" placeholder="123456:ABC-DEF..." autocomplete="off" />
      <label class="set-label">Telegram Chat ID</label>
      <input class="set-input" id="tgChat" type="text" placeholder="e.g. 123456789" autocomplete="off" />
      <label class="set-label" style="display:flex;align-items:center;gap:8px;cursor:pointer;">
        <input type="checkbox" id="tgEnabled" /> <span>Send Telegram alert on new request</span>
      </label>
      <div class="set-row">
        <button class="pill danger" id="tgTestBtn">Test Alert</button>
      </div>
      <div class="confirm-actions">
        <button class="btn-gray btn-sm" id="settingsClose">Close</button>
        <button class="btn-primary btn-sm" id="settingsSave">Save</button>
      </div>
    </div>
  </div>

  <!-- CONFIRM -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <h3 id="confirmTitle">Confirm</h3>
      <p id="confirmMsg"></p>
      <div class="confirm-actions">
        <button class="btn-gray btn-sm" id="confirmCancel">Cancel</button>
        <button class="btn-primary btn-sm" id="confirmOk">OK</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
  <script>
    let dp;
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); dp = e; });
    document.getElementById('installBtn')?.addEventListener('click', () => { if(!dp) return; dp.prompt(); dp = null; });
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(() => {}); }
  </script>
</body>
</html>
