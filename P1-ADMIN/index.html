<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F4F5F7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>P1-Admin · Parimatch</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/jpeg" href="LOGO/logo.jpg" />
  <link rel="apple-touch-icon" href="LOGO/logo.jpg" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar-left">
      <img class="topbar-logo" src="LOGO/logo.jpg" alt="" />
      <div class="topbar-title">P1-Admin</div>
    </div>
    <div class="topbar-right">
      <span id="connDot" style="width:8px;height:8px;border-radius:50%;background:#F57C00;display:inline-block;"></span>
    </div>
  </header>

  <!-- HOME PAGE -->
  <main class="main-content">
    <section class="page active" id="page-home">
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-icon blue">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="stat-value" id="kpiTotal">0</div>
          <div class="stat-label">Total Users</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon orange">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          </div>
          <div class="stat-value" id="kpiTotalReq">0</div>
          <div class="stat-label">Total Requests</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <div class="stat-value" id="kpiToday">0</div>
          <div class="stat-label">Today Requests</div>
        </div>
      </div>

      <div class="section-header">
        <h2>Recent Requests</h2>
        <span class="count" id="listCount"></span>
      </div>

      <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="Search by email, mobile, name..." autocomplete="off" />
      </div>

      <div class="card-list" id="cardList"></div>
    </section>

    <!-- DETAIL PAGE -->
    <section class="page" id="page-detail">
      <div class="detail-page" id="detailPage">
        <div class="detail-header">
          <button class="back-btn" id="backBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <span class="detail-title">Request Details</span>
        </div>
        <div id="detailContent"></div>
      </div>
    </section>
  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-page="home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </button>
  </nav>

  <!-- IMAGE MODAL -->
  <div class="modal-overlay" id="imageModal">
    <button class="modal-close-top" id="imageModalClose" aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="modal-inner">
      <img class="modal-image" id="modalImage" src="" alt="View" />
      <div class="modal-foot">
        <span class="modal-caption" id="modalCaption"></span>
        <button class="btn-primary btn-sm" id="modalDownload">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download
        </button>
      </div>
    </div>
  </div>

  <!-- CONFIRM -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <h3 id="confirmTitle">Confirm</h3>
      <p id="confirmMsg"></p>
      <div class="confirm-actions">
        <button class="btn-gray btn-sm" id="confirmCancel">Cancel</button>
        <button class="btn-primary btn-sm" id="confirmOk">OK</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(() => {}); }
  </script>
</body>
</html>
